<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture — Educational Academy</title>
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
<script src="data.js"></script>
<script src="quiz.js"></script>
<script src="progress.js"></script>
</head>
<body data-page="lecture">

<header class="site-header">
    <nav class="navbar">
        <a href="index.html" class="brand"><span class="brand-icon">🎓</span> Educational Academy</a>
        <button class="nav-toggle" id="navToggle">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" data-page="home">Home</a></li>
            <li><a href="sections.html" data-page="sections">Sections</a></li>
            <li><a href="progress.html" data-page="progress">Progress</a></li>
            <li><a href="about.html" data-page="about">About</a></li>
        </ul>
        <div class="nav-actions">
            <button class="icon-btn" id="themeToggle">🌙 Dark</button>
            <button class="icon-btn" id="langToggle">AR</button>
        </div>
    </nav>
</header>

<div class="breadcrumbs" id="breadcrumbArea"></div>

<div class="lecture-header">
    <button class="btn btn-secondary btn-sm" onclick="history.back()">← Back</button>
    <h1 id="lectureTitle" style="margin-top:14px;">Loading…</h1>
    <p id="lectureSubtitle" class="meta" style="color:var(--text-muted);"></p>
</div>

<div class="tabs">
    <button class="tab-btn active" data-tab="tabContent">📘 Content</button>
    <button class="tab-btn" data-tab="tabPoints">⭐ Important Points</button>
    <button class="tab-btn" data-tab="tabVocab">📖 Vocabulary</button>
    <button class="tab-btn" data-tab="tabQuiz">🧠 Quiz</button>
    <button class="tab-btn" data-tab="tabPdf">📄 PDF</button>
    <button class="tab-btn" data-tab="tabTranslate">🌐 Translation</button>
</div>

<div id="tabContent" class="tab-panel active">
    <div class="content-box" id="lectureContent">Loading…</div>
</div>

<div id="tabPoints" class="tab-panel">
    <div id="lecturePoints"></div>
</div>

<div id="tabVocab" class="tab-panel">
    <div class="search-wrap" style="max-width:320px; margin-bottom:16px;">
        <input type="text" id="vocabSearch" class="search-input" placeholder="Search vocabulary…">
    </div>
    <table class="vocab-table">
        <thead><tr><th>English Word</th><th>Arabic Translation</th></tr></thead>
        <tbody id="vocabTableBody"></tbody>
    </table>
</div>

<div id="tabQuiz" class="tab-panel">
    <div class="quiz-box" id="quizContainer"></div>
</div>

<div id="tabPdf" class="tab-panel">
    <div id="lecturePdfBox"></div>
</div>

<div id="tabTranslate" class="tab-panel">
    <div id="lectureTranslateBox"></div>
</div>

<footer class="site-footer">
    <p>&copy; 2026 Educational Academy. Built for learners everywhere.</p>
</footer>

<script src="js/data.js"></script>
<script src="js/progress.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>

    <style>

        /* =====================================================
           COMPREHENSIVE QUIZ PAGE
           ===================================================== */

        .comprehensive-page {
            min-height: calc(100vh - 80px);
            padding: 50px 20px;
        }

        .comprehensive-container {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        .comprehensive-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .comprehensive-header .quiz-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            font-size: 35px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #06b6d4
                );

            box-shadow:
                0 10px 25px rgba(79, 70, 229, 0.25);
        }

        .comprehensive-header h1 {
            margin: 0 0 10px;

            font-size: 2rem;
            font-weight: 800;

            color: var(--text);
        }

        .comprehensive-header p {
            margin: 0;

            color: var(--text-muted);
        }


        /* Quiz box */

        .comprehensive-quiz-box {
            padding: 35px;

            border-radius: 22px;

            background: var(--card);

            border: 1px solid var(--border);

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.08);
        }


        /* Progress */

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 20px;
        }

        .quiz-counter {
            font-weight: 700;
            color: var(--text);
        }

        .quiz-progress-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .quiz-progress-bar {
            width: 100%;
            height: 8px;

            margin-bottom: 30px;

            overflow: hidden;

            border-radius: 20px;

            background: var(--primary-light);
        }

        .quiz-progress-fill {
            width: 0;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #4f46e5,
                    #06b6d4
                );

            transition: width 0.3s ease;
        }


        /* Question */

        .comprehensive-question {
            margin-bottom: 25px;

            font-size: 1.25rem;
            font-weight: 800;

            line-height: 1.6;

            color: var(--text);
        }


        /* Options */

        .comprehensive-options {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;
        }

        .comprehensive-option {
            width: 100%;

            padding: 17px 18px;

            border: 2px solid var(--border);

            border-radius: 14px;

            background: var(--card);

            color: var(--text);

            font-family: inherit;

            font-size: 0.95rem;

            text-align: left;

            cursor: pointer;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }

        .comprehensive-option:hover {
            transform: translateY(-2px);

            border-color: var(--primary);
        }

        .comprehensive-option.selected {
            border-color: var(--primary);

            background: var(--primary-light);
        }

        .comprehensive-option.correct {
            border-color: #16a34a;

            background: rgba(22, 163, 74, 0.10);

            color: #15803d;
        }

        .comprehensive-option.wrong {
            border-color: #dc2626;

            background: rgba(220, 38, 38, 0.10);

            color: #b91c1c;
        }

        .comprehensive-option:disabled {
            cursor: default;
        }


        /* Feedback */

        .comprehensive-feedback {
            min-height: 28px;

            margin-top: 18px;

            font-weight: 700;

            text-align: center;
        }

        .feedback-correct {
            color: #16a34a;
        }

        .feedback-wrong {
            color: #dc2626;
        }


        /* Navigation */

        .quiz-navigation {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-top: 30px;
        }

        .quiz-nav-btn {
            min-width: 130px;

            padding: 12px 20px;

            border: none;

            border-radius: 12px;

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .quiz-nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .quiz-nav-btn:disabled {
            opacity: 0.45;

            cursor: not-allowed;
        }

        .quiz-prev {
            color: var(--text);

            background: var(--primary-light);
        }

        .quiz-next {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #06b6d4
                );
        }


        /* Result */

        .comprehensive-result {
            text-align: center;

            padding: 20px 0;
        }

        .result-icon {
            font-size: 65px;

            margin-bottom: 15px;
        }

        .result-title {
            margin: 0 0 10px;

            font-size: 2rem;

            color: var(--text);
        }

        .result-score {
            margin: 20px 0;

            font-size: 3.5rem;

            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #06b6d4
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .result-details {
            color: var(--text-muted);

            font-size: 1rem;

            line-height: 2;
        }

        .restart-btn {
            margin-top: 25px;

            padding: 14px 28px;

            border: none;

            border-radius: 12px;

            color: #fff;

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #06b6d4
                );

            transition:
                transform 0.2s ease;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
        }


        /* No questions */

        .quiz-empty {
            padding: 50px 20px;

            text-align: center;

            color: var(--text-muted);
        }


        /* Mobile */

        @media (max-width: 700px) {

            .comprehensive-page {
                padding: 30px 15px;
            }

            .comprehensive-quiz-box {
                padding: 22px 18px;
            }

            .comprehensive-header h1 {
                font-size: 1.6rem;
            }

            .comprehensive-options {
                grid-template-columns: 1fr;
            }

            .comprehensive-question {
                font-size: 1.05rem;
            }

            .quiz-navigation {
                flex-direction: column;
            }

            .quiz-nav-btn {
                width: 100%;
            }

            .result-score {
                font-size: 2.8rem;
            }
        }

    </style>
</head>
